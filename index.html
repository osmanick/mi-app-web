<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Aplicación Web</title>

  <!-- Enlace al Manifest PWA -->
  <link rel="manifest" href="manifest.json">

  <!-- Color de barra y tema -->
  <meta name="theme-color" content="#00875f">

  <!-- Compatibilidad PWA móvil -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Barra superior -->
  <header class="app-header">
    <div class="header-container">
      <h1 class="logo">MiApp</h1>
      <nav class="nav-links">
        <a href="#registro">Registros</a>
        <!-- Botón de instalación PWA (oculto por defecto) -->
        <button id="btn-install" class="btn-install" hidden>
          📥 Instalar App
        </button>
      </nav>
    </div>
  </header>

  <!-- Contenedor principal -->
  <main class="main-container">
    <section class="card">
      <h2>Registro de Datos</h2>
      <form id="form-data">
        <div class="form-group">
          <label for="item-input">Concepto o descripción:</label>
          <input type="text" id="item-input" placeholder="Ej. Material o movimiento..." required>
        </div>
        <div class="form-group">
          <label for="amount-input">Monto o cantidad:</label>
          <input type="number" id="amount-input" placeholder="0.00" step="0.01" required>
        </div>
        <button type="submit" class="btn-primary">Guardar</button>
      </form>
    </section>

    <section class="card">
      <h2>Listado</h2>
      <ul id="items-list" class="item-list">
        <!-- Renderizado dinámico desde app.js -->
      </ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
